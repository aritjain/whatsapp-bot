<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JMS Tasks">
<meta name="theme-color" content="#060b16">
<title>JMS Chief-of-Staff</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root{
  --nav:#060b16; --bg:#0a1120; --field:#0d1526; --surface:#151e31; --surface-2:#1d283f; --surface-3:#26334e;
  --scrim:rgba(3,7,18,.74);
  --ink:#f1f5f9; --ink-2:#cbd5e1; --ink-3:#94a3b8; --ink-4:#64748b;
  --line:#243149; --line-2:#35455f; --line-3:#4a5c7a;
  --accent:#6366f1; --accent-press:#4f46e5; --accent-ink:#a5b4fc; --accent-soft:#1d1f4d; --accent-2:#8b5cf6;
  --hdr-grad:linear-gradient(135deg,#312e81 0%,#4338ca 48%,#6d28d9 100%);
  --p1:#ef4444; --p1-ink:#fca5a5; --p1-soft:#3a1418;
  --p2:#f59e0b; --p2-ink:#fcd34d; --p2-soft:#3a2708;
  --p3:#3b82f6; --p3-ink:#93c5fd; --p3-soft:#122a4d;
  --p4:#64748b; --p4-ink:#cbd5e1; --p4-soft:#222d43;
  --st-open:#334155; --st-open-ink:#cbd5e1; --st-prog:#0e7490; --st-prog-ink:#cffafe;
  --st-verify:#fb923c; --st-verify-ink:#2a1607; --st-done:#22c55e; --st-done-ink:#052e16;
  --ok:#22c55e; --ok-ink:#86efac; --warn:#f59e0b; --warn-ink:#fcd34d; --warn-soft:#3a2708;
  --danger:#ef4444; --danger-ink:#fca5a5; --danger-soft:#3a1418; --danger-line:#7f1d1d;
  --wa:#25d366; --wa-press:#1eb455; --wa-ink:#04331a;
  --age-cool:#94a3b8; --age-warm:#fcd34d; --age-hot:#fca5a5;
  --age-hot-bg:#3a1418; --age-warm-bg:#3a2708; --age-cool-bg:#1d283f;
  --r1:8px; --r2:10px; --r3:14px; --r4:20px; --r5:22px; --rf:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 6px 20px rgba(0,0,0,.45); --sh-3:0 -6px 24px rgba(0,0,0,.5);
  --t-fast:120ms cubic-bezier(.2,.8,.2,1); --t-base:200ms cubic-bezier(.2,.8,.2,1);
}
body{ font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom)); -webkit-text-size-adjust:100%; }
body.no-nav{ padding-bottom:0; }
body.has-actionbar{ padding-bottom:calc(150px + env(safe-area-inset-bottom)); }

.header{ background:var(--hdr-grad); padding:18px 16px 14px; padding-top:calc(18px + env(safe-area-inset-top));
  position:sticky; top:0; z-index:20; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.header h1{ font-size:1.25rem; font-weight:700; letter-spacing:-0.02em; color:#fff; }
.header p{ color:#c7d2fe; font-size:0.78rem; font-weight:500; margin-top:3px; }
.hbtns{ display:flex; gap:8px; align-items:center; }
.hbtn{ width:38px; height:38px; border:none; border-radius:var(--r2); background:rgba(255,255,255,.14);
  color:#fff; font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.syncdot{ width:11px; height:11px; border-radius:var(--rf); background:var(--ok); flex-shrink:0; }
.syncdot.pending{ background:var(--warn); animation:pulse 1.4s infinite; }
.syncdot.offline{ background:var(--ink-4); }
.syncdot.error{ background:var(--danger); animation:pulse 1.4s infinite; }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }

.wrap{ max-width:640px; margin:0 auto; padding:14px 14px 0; }
.view{ display:none; } .view.active{ display:block; animation:fade .18s ease; }
@keyframes fade{ from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:15px 14px; margin-bottom:13px; }
h2.sec{ font-size:0.70rem; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin:2px 0 10px; font-weight:700; }
label.f{ display:block; font-size:0.72rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em; margin:12px 0 6px; font-weight:600; }
input, select, textarea{ width:100%; min-height:44px; padding:12px 13px; background:var(--field); border:1px solid var(--line-2);
  border-radius:var(--r2); color:var(--ink); font-size:1rem; outline:none; font-family:inherit; }
input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
input::placeholder, textarea::placeholder{ color:var(--ink-4); }
textarea{ resize:vertical; min-height:72px; }
.row2{ display:flex; gap:10px; } .row2 > *{ flex:1; }
.hint{ font-size:0.76rem; color:var(--ink-3); line-height:1.45; margin-top:8px; }
.hint.warnbox{ background:var(--warn-soft); color:var(--warn-ink); border-radius:var(--r2); padding:10px 12px; }
.pre{ white-space:pre-line; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:48px; padding:12px 18px;
  background:var(--accent); color:#fff; border:none; border-radius:var(--r2); font-size:0.95rem; font-weight:600;
  cursor:pointer; width:100%; transition:filter var(--t-fast), transform var(--t-fast); }
.btn.wa{ background:var(--wa); color:var(--wa-ink); font-weight:700; }
.btn.ok{ background:var(--ok); color:#052e16; font-weight:700; }
.btn.ghost{ background:transparent; border:1px solid var(--line-2); color:var(--ink); }
.btn.sm{ width:auto; min-height:44px; padding:9px 14px; font-size:0.84rem; }
.btn.dangerbtn{ background:var(--danger); color:#fff; }
.btn:disabled{ opacity:.55; pointer-events:none; }
.btn:active,.ic:active,.chip:active,.prio:active{ transform:scale(.975); filter:brightness(.92); }

.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ min-height:44px; display:inline-flex; align-items:center; padding:9px 13px; background:var(--field); border:1px solid var(--line-2);
  border-radius:var(--r4); font-size:0.85rem; cursor:pointer; white-space:nowrap; color:var(--ink-2); }
.chip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.chip .dot,.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.chip.sel .dot{ background:#fff !important; }

.prio-row{ display:flex; gap:8px; }
.prio{ flex:1; text-align:center; min-height:58px; padding:9px 2px; border-radius:var(--r2); border:1px solid var(--line-2);
  background:var(--field); cursor:pointer; color:var(--ink-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
.prio b{ font-size:0.85rem; font-weight:800; } .prio i{ font-style:normal; font-size:0.63rem; font-weight:600; opacity:.8; }
.prio.sel{ color:#fff; }
.prio[data-p="P1"].sel{ background:var(--p1); border-color:var(--p1); }
.prio[data-p="P2"].sel{ background:var(--p2); border-color:var(--p2); color:#2a1a02; }
.prio[data-p="P3"].sel{ background:var(--p3); border-color:var(--p3); }
.prio[data-p="P4"].sel{ background:var(--p4); border-color:var(--p4); }

.filters{ display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px; -webkit-overflow-scrolling:touch;
  mask-image:linear-gradient(90deg,#000 88%,transparent); -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent); }
.filters::-webkit-scrollbar{ display:none; }
.fchip{ min-height:40px; display:inline-flex; align-items:center; padding:7px 13px; background:var(--field); border:1px solid var(--line-2);
  border-radius:var(--r4); font-size:0.78rem; white-space:nowrap; cursor:pointer; color:var(--ink-2); flex-shrink:0; }
.fchip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; }
.fchip.verifychip{ background:var(--st-verify); border-color:var(--st-verify); color:var(--st-verify-ink); font-weight:700; }

/* task card */
.task{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--p4); border-radius:var(--r3);
  padding:12px 13px; margin-bottom:10px; }
.task.P1{ border-left-color:var(--p1); } .task.P2{ border-left-color:var(--p2); }
.task.P3{ border-left-color:var(--p3); } .task.P4{ border-left-color:var(--p4); }
.task.done{ opacity:.55; }
.task.verify{ box-shadow:0 0 0 1px rgba(251,146,60,.35); }
.task-top{ display:flex; align-items:flex-start; gap:8px; }
.task-title{ font-size:0.97rem; font-weight:600; line-height:1.35; flex:1; min-width:0; letter-spacing:-0.005em; }
.task.done .task-title{ text-decoration:line-through; color:var(--ink-3); }
.notes{ font-size:0.83rem; color:var(--ink-2); line-height:1.45; margin-top:5px; white-space:pre-line;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.task-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; align-items:center; }
.tag{ display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:var(--r1);
  font-size:0.67rem; font-weight:700; line-height:1.5; white-space:nowrap; }
.tag.pP1{ background:var(--p1-soft); color:var(--p1-ink); } .tag.pP2{ background:var(--p2-soft); color:var(--p2-ink); }
.tag.pP3{ background:var(--p3-soft); color:var(--p3-ink); } .tag.pP4{ background:var(--p4-soft); color:var(--p4-ink); }
.tag.grp{ background:var(--surface-2); color:var(--ink-2); }
.tag.who{ background:var(--accent-soft); color:var(--accent-ink); }
.tag.due{ background:var(--field); color:var(--ink-2); } .tag.due.over{ background:var(--danger); color:#fff; }
.tag.st-open{ background:var(--st-open); color:var(--st-open-ink); }
.tag.st-inprogress{ background:var(--st-prog); color:var(--st-prog-ink); }
.tag.st-awaiting_verify{ background:var(--st-verify); color:var(--st-verify-ink); }
.tag.st-done{ background:var(--st-done); color:var(--st-done-ink); }
.tag.rem{ background:var(--surface-2); color:var(--ink-3); }
.tag.rep{ background:#3c1f6e; color:#ddd6fe; }
.age{ flex-shrink:0; padding:4px 7px; border-radius:var(--r1); font-size:0.7rem; font-weight:700;
  font-variant-numeric:tabular-nums; background:var(--age-cool-bg); color:var(--age-cool); }
.age.warm{ background:var(--age-warm-bg); color:var(--age-warm); }
.age.hot{ background:var(--age-hot-bg); color:var(--age-hot); }
.cmt{ font-size:0.76rem; color:var(--ink-3); margin-top:8px; white-space:pre-line; }
.task-actions{ display:flex; gap:8px; margin-top:11px; }
.ic{ flex:1; min-height:44px; background:var(--field); border:1px solid var(--line-2); border-radius:var(--r2); color:var(--ink);
  font-size:0.82rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; }
.ic.wa{ background:var(--wa); border-color:var(--wa); color:var(--wa-ink); }
.ic.wa:disabled,.ic.disabled{ background:var(--field); color:var(--ink-4); border-color:var(--line); }
.ic.verifybtn{ background:var(--st-verify); border-color:var(--st-verify); color:var(--st-verify-ink); }
.ic.okbtn{ background:var(--ok); border-color:var(--ok); color:#052e16; }
.ic.narrow{ flex:0 0 52px; }
.waitstrip{ flex:1; min-height:40px; display:flex; align-items:center; justify-content:center; border-radius:var(--r2);
  background:var(--warn-soft); color:var(--st-verify); font-size:0.8rem; font-weight:700; }

/* stats & bars */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-bottom:10px; }
.stats.two{ grid-template-columns:repeat(2,1fr); }
.stat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:12px 8px; text-align:center; cursor:pointer; }
.stat .n{ font-size:1.6rem; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
.stat .l{ font-size:0.62rem; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; font-weight:700; }
.stat.p1 .n{color:var(--p1)} .stat.p2 .n{color:var(--p2)} .stat.p3 .n{color:var(--p3)} .stat.p4 .n{color:var(--p4)}
.stat.overdue{ border-left:4px solid var(--danger); } .stat.overdue .n{ color:var(--danger); }
.stat.verify{ border-left:4px solid var(--st-verify); } .stat.verify .n{ color:var(--st-verify); }
.bars{ margin-top:6px; }
.bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:0.82rem; min-height:24px; }
.bar-lbl{ width:34%; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-track{ flex:1; height:9px; background:var(--field); border-radius:5px; overflow:hidden; }
.bar-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:5px; }
.bar-n{ width:30px; text-align:right; color:var(--ink); font-weight:800; font-size:0.85rem; font-variant-numeric:tabular-nums; }

/* chase */
.chase-row{ display:flex; align-items:center; gap:12px; padding:12px 8px; border-bottom:1px solid var(--line); min-height:68px; }
.chase-row:active{ background:var(--surface); }
.chase-row.sent{ opacity:.5; }
.chk-hit{ min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.chk{ width:26px; height:26px; border:2px solid var(--line-3); border-radius:var(--r1); display:flex; align-items:center;
  justify-content:center; color:#fff; font-size:0.9rem; font-weight:800; }
.chk.on{ background:var(--accent); border-color:var(--accent); }
.chk.off{ border-color:var(--line); }
.avatar{ width:40px; height:40px; border-radius:var(--rf); display:flex; align-items:center; justify-content:center;
  font-weight:700; color:#fff; flex-shrink:0; font-size:0.85rem; }
.crow-main{ flex:1; min-width:0; overflow:hidden; cursor:pointer; }
.crow-name{ font-size:0.97rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crow-meta{ font-size:0.76rem; color:var(--ink-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.count{ min-width:28px; height:26px; border-radius:var(--rf); background:var(--accent-soft); color:var(--accent-ink);
  font-size:0.8rem; font-weight:700; line-height:26px; text-align:center; padding:0 8px; flex-shrink:0; }
.count.zero{ background:var(--field); color:var(--ink-4); }
.tag.warnfix{ background:var(--warn-soft); color:var(--warn-ink); }
.selrow{ display:flex; align-items:center; justify-content:space-between; padding:2px 8px 6px; font-size:0.8rem; color:var(--ink-3); }

.actionbar{ position:fixed; left:0; right:0; bottom:calc(72px + env(safe-area-inset-bottom)); z-index:29; padding:10px 14px;
  background:linear-gradient(180deg,rgba(10,17,32,0),var(--bg) 26%); transform:translateY(130%); transition:transform var(--t-base); }
.actionbar.show{ transform:none; }
.actionbar .inner{ max-width:640px; margin:0 auto; }
.clearsel{ display:block; text-align:center; font-size:0.76rem; color:var(--ink-3); padding:8px; cursor:pointer; }

/* contact cards */
.contact-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); padding:12px 12px 8px; margin-bottom:12px; }
.cc-top{ display:flex; align-items:center; gap:10px; }
.cc-info{ flex:1; min-width:0; }
.cc-name{ font-size:0.97rem; font-weight:600; }
.cc-phone{ font-size:0.78rem; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.memchips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.memchip{ font-size:0.67rem; font-weight:700; background:var(--surface-2); color:var(--ink-2); border-radius:var(--r4); padding:4px 9px;
  display:inline-flex; align-items:center; gap:5px; }
.memchip .dot{ width:7px; height:7px; margin-right:0; }
.cc-warn{ margin-top:8px; background:var(--warn-soft); color:var(--warn-ink); border-radius:var(--r2); padding:7px 9px; font-size:0.74rem; font-weight:600; }
.cc-actions{ display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }

/* rows (users, more) */
.rowitem{ display:flex; align-items:center; gap:11px; min-height:52px; padding:8px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
.rowitem:last-child{ border-bottom:none; }
.rowitem .ri-ic{ width:28px; text-align:center; font-size:1.15rem; }
.rowitem .ri-main{ flex:1; min-width:0; }
.rowitem .ri-t{ font-size:0.92rem; font-weight:600; }
.rowitem .ri-s{ font-size:0.76rem; color:var(--ink-3); margin-top:1px; }
.rowitem .ri-x{ color:var(--ink-4); font-size:0.95rem; }
.statusdot{ width:8px; height:8px; border-radius:var(--rf); display:inline-block; margin-right:5px; }

/* segmented */
.seg{ display:flex; background:var(--field); border-radius:var(--r2); padding:3px; margin-bottom:12px; position:sticky; top:0; z-index:10; }
.seg button{ flex:1; min-height:40px; border:none; background:none; color:var(--ink-3); border-radius:8px; font-size:0.82rem;
  font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; }
.seg button.active{ background:var(--surface-2); color:var(--ink); box-shadow:var(--sh-1); }
.segbadge{ font-size:0.66rem; background:var(--accent-soft); color:var(--accent-ink); border-radius:var(--rf); padding:1px 7px; }
.segbadge.amber{ background:var(--st-verify); color:var(--st-verify-ink); }

/* nav */
.nav{ position:fixed; bottom:0; left:0; right:0; background:var(--nav); border-top:1px solid var(--line); display:flex; z-index:30;
  padding:6px 0 max(6px, env(safe-area-inset-bottom)); box-shadow:0 -1px 0 rgba(255,255,255,.03); }
.nav button{ flex:1; min-height:52px; background:none; border:none; color:var(--ink-3); font-size:0.62rem; font-weight:600; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:5px 0; position:relative; }
.nav button .ni{ font-size:1.28rem; line-height:1; transition:transform var(--t-fast); }
.nav button.active{ color:var(--accent-ink); }
.nav button.active .ni{ transform:translateY(-1px) scale(1.08); }
.nav button.active::before{ content:""; position:absolute; top:0; width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--accent); }
.nav .ndot{ position:absolute; top:4px; right:calc(50% - 18px); width:7px; height:7px; border-radius:var(--rf); background:var(--st-verify); }
.nav .ndot.red{ background:var(--danger); }

/* modal */
.modal{ position:fixed; inset:0; background:var(--scrim); display:none; align-items:flex-end; justify-content:center; z-index:50; }
.modal.show{ display:flex; animation:fade var(--t-fast); }
.sheet{ background:var(--surface); border-radius:var(--r5) var(--r5) 0 0; width:100%; max-width:640px;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; box-shadow:var(--sh-3); animation:slideup var(--t-base); }
.sheet::before{ content:""; display:block; width:38px; height:4px; border-radius:2px; background:var(--line-3); margin:0 auto 14px; }
@keyframes slideup{ from{transform:translateY(24px)} to{transform:none} }
.sheet h3{ font-size:1.06rem; font-weight:700; letter-spacing:-0.01em; margin-bottom:4px; }
.sheet .sub{ font-size:0.82rem; color:var(--ink-3); margin-bottom:4px; }
.sheet-actions{ position:sticky; bottom:0; background:var(--surface); padding-top:12px; margin-top:18px; display:flex; gap:12px;
  box-shadow:0 -12px 12px -12px #000; }
.sheet-actions .btn{ flex:1; } .sheet-actions .btn:last-child{ flex:1.3; }
.danger-row{ display:flex; align-items:center; gap:10px; min-height:50px; margin-top:16px; padding:0 12px; border:1px solid var(--danger-line);
  border-radius:var(--r2); background:var(--danger-soft); color:var(--danger-ink); font-size:0.85rem; font-weight:700; cursor:pointer; }

/* activity timeline */
.act-row{ display:flex; gap:10px; padding:9px 0 9px 14px; border-left:2px solid var(--line); margin-left:5px; position:relative;
  font-size:0.82rem; color:var(--ink-2); }
.act-row::before{ content:""; position:absolute; left:-4.5px; top:14px; width:7px; height:7px; border-radius:var(--rf); background:var(--accent); }
.act-row .ts{ font-size:0.72rem; color:var(--ink-4); white-space:nowrap; }
.act-row b{ color:var(--ink); font-weight:600; }

/* toast / offline */
.toast{ position:fixed; left:50%; transform:translateX(-50%) translateY(8px); bottom:calc(88px + env(safe-area-inset-bottom)); z-index:60;
  padding:11px 18px; border-radius:var(--r4); font-size:0.85rem; font-weight:700; line-height:1.3; max-width:90vw; text-align:center;

.toast.t-ok{ background:var(--ok); color:#052e16; }

.empty .btn{ margin-top:16px; width:auto; padding:12px 22px; display:inline-flex; }

.logo{ width:56px; height:56px; border-radius:16px; background:var(--hdr-grad); color:#fff; font-weight:800; font-size:1rem;
  display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.loginwrap h1{ text-align:center; font-size:1.35rem; font-weight:700; }

.eyebrow{ display:inline-block; background:var(--accent-soft); color:var(--accent-ink); border-radius:var(--r4);
  font-size:0.67rem; font-weight:700; padding:5px 11px; margin-bottom:8px; }
.phonerow{ display:flex; gap:8px; } .phonerow .cc{ flex:0 0 64px; }
.pwrow{ position:relative; }

  font-size:1rem; cursor:pointer; }

.successtrip{ background:#0d2a19; color:var(--ok-ink); border-radius:var(--r2); padding:10px 12px; font-size:0.84rem; font-weight:600;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }

.msgprev{ background:var(--field); border-radius:var(--r2); padding:12px; font-size:0.8rem; line-height:1.5; color:var(--ink-2);
  white-space:pre-wrap; max-height:190px; overflow:auto; margin-top:6px; }
.progressbar{ height:4px; background:var(--line); border-radius:var(--rf); overflow:hidden; margin:10px 0 14px; }
.progressbar .fill{ height:100%; background:var(--wa); border-radius:var(--rf); transition:width var(--t-base); }
@keyframes shake{ 0%,100%{transform:none} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.shake{ animation:shake 300ms; }
</style>
</head>
<body class="no-nav">
  <div class="offline" id="offlineBar">📴 Offline — changes saved on this phone</div>

  <!-- LOGIN -->
  <section id="v-login" class="view active"><div class="loginwrap" id="loginBox"></div></section>

  <!-- app shell -->
  <div id="appHeader" style="display:none"></div>
  <div class="wrap" id="appWrap" style="display:none">
    <section id="v-chase" class="view"></section>
    <section id="v-tasks" class="view"></section>
    <section id="v-assign" class="view"></section>
    <section id="v-contacts" class="view"></section>
    <section id="v-dash" class="view"></section>
    <section id="v-mytasks" class="view"></section>
    <section id="v-admin" class="view"></section>
    <section id="v-mine" class="view"></section>
  </div>

  <div class="actionbar" id="actionbar"><div class="inner" id="actionbarInner"></div></div>
  <nav class="nav" id="nav" style="display:none"></nav>
  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="modal" id="modal2" style="z-index:55"><div class="sheet" id="sheet2" style="max-height:60vh"></div></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="importFile" accept="application/json" style="display:none">
  <input type="file" id="vcfFile" accept=".vcf,text/vcard" style="display:none">

<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* for strings interpolated into onclick JS: backslash-escape for JS first, then HTML-escape */
const jsEsc=s=>esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' '));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* keep normPhone/phoneOk textually identical to netlify/functions/api.mjs */
function normPhone(raw){
  const s=String(raw||'').trim();
  const plus=s.startsWith('+');
  let d=s.replace(/[^0-9]/g,'');
  if(d.startsWith('00')) d=d.slice(2);
  if(!plus&&d.length===11&&d.startsWith('0')) d=d.slice(1);
  if(!plus&&d.length===10&&/^[6-9]/.test(d)) d='91'+d;
  return d;
}
function phoneOk(raw){
  const s=String(raw||'').trim();
  const plus=s.startsWith('+');
  const d=normPhone(raw);
  if(d.length<11||d.length>15) return false;
  if(d.startsWith('91')) return d.length===12&&/^[6-9]/.test(d.slice(2));
  if(plus||d.length>=11) return true;
  return false;
}
const DAY=86400000;
const prioRank=p=>({P1:1,P2:2,P3:3,P4:4}[p]||5);
const PRIO_LABEL={P1:'Today',P2:'This week',P3:'This month',P4:'Someday'};
const REPEATS={none:'One-time',weekly:'Weekly',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly'};
const ST_LABEL={open:'Open',inprogress:'In progress',awaiting_verify:'⏳ Awaiting verify',done:'✓ Done'};
function ageDays(t){ return Math.max(0,Math.floor((Date.now()-(t.createdAt||Date.now()))/DAY)); }
function ageLabel(t){ const d=ageDays(t); return d>90?Math.floor(d/30)+'mo':d+'d'; }
function ageClass(t){ const d=ageDays(t); return (isOverdue(t)||d>=7)?'hot':d>=3?'warm':''; }
function isOverdue(t){ return t.deadline&&t.status!=='done'&&new Date(t.deadline)<new Date(); }
function fmtDue(d){ if(!d) return null; const dt=new Date(d), now=new Date();
  if(dt.toDateString()===now.toDateString()) return 'Today '+dt.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  const opts={month:'short',day:'numeric'}; if(dt.getFullYear()!==now.getFullYear()) opts.year='numeric';
  return dt.toLocaleDateString('en-IN',opts); }
function fmtAgo(ts){ if(!ts) return ''; const m=Math.floor((Date.now()-ts)/60000);
  if(m<60) return m+'m ago'; const h=Math.floor(m/60); if(h<24) return h+'h ago'; return Math.floor(h/24)+'d ago'; }
function fmtTs(ts){ const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}); }
function toLocalInput(d){ const x=new Date(d),p=n=>String(n).padStart(2,'0');
  return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}T${p(x.getHours())}:${p(x.getMinutes())}`; }
let toastTimer=null;
function toast(m,variant){ const t=$('#toast'); t.textContent=m; t.className='toast show'+(variant?' t-'+variant:'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2000); }

/* ================= state ================= */
let session=null; try{ session=JSON.parse(localStorage.getItem('jms_v2_session')); }catch(e){}
let db={groups:[],contacts:[],tasks:[],personal:[],users:[]};
let phonebook=null; // lazy, admin only, in-memory
let outbox=[];
let currentView=null;
let syncState='synced';

const cacheKey=()=>'jms_v2_cache_'+(session?session.user.id:'');
const outboxKey=()=>'jms_v2_outbox_'+(session?session.user.id:'');
function loadCache(){ try{ const d=JSON.parse(localStorage.getItem(cacheKey())); if(d&&d.groups) db=d; }catch(e){}
  try{ outbox=JSON.parse(localStorage.getItem(outboxKey()))||[]; }catch(e){ outbox=[]; } }
function saveCache(){ try{ localStorage.setItem(cacheKey(),JSON.stringify(db)); localStorage.setItem(outboxKey(),JSON.stringify(outbox)); }catch(e){ toast('Storage full — cache not saved','err'); } }
const isAdmin=()=>session&&session.user.role==='admin';
const me=()=>session?session.user:null;

function groupById(id){ return db.groups.find(g=>g.id===id); }
function contactById(id){ return db.contacts.find(c=>c.id===id); }
function userName(id){ if(!id) return 'System'; if(session&&id===session.user.id) return session.user.name.split(' ')[0];
  const u=(db.users||[]).find(x=>x.id===id); if(u) return u.name.split(' ')[0];
  if(db.names&&db.names[id]) return db.names[id];
  return 'Staff'; }
function openTasksFor(cid){ return db.tasks.filter(t=>t.contactId===cid&&t.status!=='done'); }
function chaseTasksFor(cid){ return db.tasks.filter(t=>t.contactId===cid&&(t.status==='open'||t.status==='inprogress')); }

/* ================= api + sync engine ================= */
async function api(path,opts={}){
  const res=await fetch('/api'+path,{
    method:opts.method||'GET',
    headers:{'content-type':'application/json',...(session?{authorization:'Bearer '+session.token}:{})},
    body:opts.body?JSON.stringify(opts.body):undefined,
  });
  const body=await res.json().catch(()=>({}));
  if(res.status===401&&session){ logout(true); throw new Error('Session expired — please log in again'); }
  if(!res.ok) throw new Error(body.error||('Error '+res.status));
  return body;
}
function setSync(s){ syncState=s; const d=$('#syncDot'); if(d) d.className='syncdot '+(s==='synced'?'':s); }
function applySnapshot(resp){
  if(resp.user) session.user=resp.user, localStorage.setItem('jms_v2_session',JSON.stringify(session));
  db={...db,...resp.data};
  if(isAdmin()&&resp.data.users) db.users=resp.data.users;
  saveCache();
}
async function pull(){
  if(pushing||outbox.length){ flush(); return; } // never let a stale GET race queued writes
  try{ const resp=await api('/sync'); applySnapshot(resp); setSync('synced'); hideOffline(); rerender(); }
  catch(e){ if(!navigator.onLine||/fetch/i.test(e.message)) { setSync('offline'); showOffline(); } }
}
let pushTimer=null, pushing=false;
function enqueue(ops){ outbox.push(...ops); saveCache(); setSync('pending'); schedulePush(); }
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(flush,1500); }
async function flush(){
  if(pushing||!outbox.length||!session) return;
  pushing=true;
  const batch=outbox.slice();
  try{
    const resp=await api('/push',{method:'POST',body:{ops:batch}});
    outbox=outbox.slice(batch.length);
    applySnapshot(resp);
    outbox.forEach(applyLocal); // re-apply ops queued while the push was in flight
    setSync(outbox.length?'pending':'synced'); hideOffline();
    if(resp.rejected&&resp.rejected.length) toast(resp.rejected.length+' change(s) rejected by server','err');
    rerender();
  }catch(e){
    if(!navigator.onLine||/fetch|network/i.test(e.message)){ setSync('offline'); showOffline(); }
    else { setSync('error'); toast(e.message,'err'); }
  }
  pushing=false;
  if(outbox.length) schedulePush();
}
function showOffline(){ const b=$('#offlineBar'); b.textContent='📴 Offline — '+(outbox.length? outbox.length+' change(s) saved on this phone':'showing saved data'); b.classList.add('show'); }
function hideOffline(){ $('#offlineBar').classList.remove('show'); }
window.addEventListener('online',()=>{ if(session) pull(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&session) pull(); });

/* optimistic local application */
function applyLocal(op){
  const find=id=>db.tasks.find(t=>t.id===id);
  if(op.t==='status'){ const t=find(op.id); if(t){
      (t.activity=t.activity||[]).push({ts:Date.now(),uid:me().id,type:'status',data:{to:op.to}});
      if(op.to==='done'&&op.roll&&op.nextDeadline){ t.deadline=op.nextDeadline; t.status='open'; t.doneAt=null;
        t.activity.push({ts:Date.now(),uid:me().id,type:'recurred'}); }
      else { t.status=op.to; t.doneAt=op.to==='done'?Date.now():null; }
      t.updatedAt=Date.now(); } }
  else if(op.t==='comment'){ const t=find(op.id); if(t){ (t.activity=t.activity||[]).push({ts:Date.now(),uid:me().id,type:'comment',data:{text:op.text}}); } }
  else if(op.t==='remind'){ for(const id of op.ids){ const t=find(id); if(t){ t.lastRemindedAt=Date.now(); t.remindCount=(t.remindCount||0)+1;
      (t.activity=t.activity||[]).push({ts:Date.now(),uid:me().id,type:'reminded'}); } } }
  else if(op.t==='upsert'){ const col=db[op.col]; if(!col) return; const i=col.findIndex(r=>r.id===op.rec.id);
    if(op.col==='contacts'){ op.rec.normPhone=normPhone(op.rec.phone); op.rec.phoneOk=phoneOk(op.rec.phone); }
    if(i>=0) col[i]={...col[i],...op.rec}; else col.push(op.col==='tasks'?{createdAt:Date.now(),remindCount:0,activity:[{ts:Date.now(),uid:me().id,type:'created'}],...op.rec}:op.rec); }
  else if(op.t==='delete'){ if(db[op.col]) db[op.col]=db[op.col].filter(r=>r.id!==op.id); }
}
let sheetRefresh=null;
function mutate(ops){ ops.forEach(applyLocal); saveCache(); rerender();
  if(sheetRefresh&&$('#modal').classList.contains('show')) sheetRefresh();
  enqueue(ops); }

/* ================= auth screens ================= */
function renderLogin(mode){
  document.body.classList.add('no-nav');
  $('#nav').style.display='none'; $('#appHeader').style.display='none'; $('#appWrap').style.display='none';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#v-login').classList.add('active');
  const box=$('#loginBox');
  if(mode==='bootstrap'){
    box.innerHTML=`
      <div class="logo">JMS</div><h1>Chief-of-Staff</h1><div class="tag-sub">Assign · Remind · Track</div>
      <div class="card"><span class="eyebrow">🔐 FIRST-TIME SETUP</span>
        <h3 style="font-size:1.06rem;font-weight:700">Create the admin account</h3>
        <div class="sub">This is the CEO login. Only one admin is created.</div>
        <label class="f">Your name</label><input id="bName" placeholder="Arit Jain" autocomplete="name">
        <label class="f">Mobile number</label><input id="bPhone" type="tel" inputmode="tel" placeholder="+91 98765 43210" oninput="phonePreview('bPhone','bPrev')">
        <div class="hint" id="bPrev"></div>
        <label class="f">Password</label>
        <div class="pwrow"><input id="bPw" type="password" placeholder="10+ characters"><button class="eye" onclick="togglePw('bPw')">👁</button></div>
        <label class="f">Confirm password</label><input id="bPw2" type="password">
        <button class="btn" style="margin-top:16px" onclick="doBootstrap()">Create admin &amp; continue</button>
        <div class="hint warnbox" style="margin-top:12px">ⓘ Save this password. There is no self-service reset for admin.</div>
        <div class="hint" id="bErr" style="color:var(--danger-ink)"></div>
      </div>`;
  } else {
    box.innerHTML=`
      <div class="logo">JMS</div><h1>Chief-of-Staff</h1><div class="tag-sub">Assign · Remind · Track</div>
      <form class="card" onsubmit="return doLogin(event)">
        <label class="f">Mobile number</label><input id="lPhone" type="tel" inputmode="tel" placeholder="98765 43210" autocomplete="tel">
        <label class="f">Password</label>
        <div class="pwrow"><input id="lPw" type="password" placeholder="••••••••" autocomplete="current-password"><button type="button" class="eye" onclick="togglePw('lPw')">👁</button></div>
        <button class="btn" id="loginBtn" style="margin-top:16px">Sign in</button>
        <div class="hint" id="lErr" style="color:var(--danger-ink)"></div>
      </form>
      <div class="hint" style="text-align:center;color:var(--ink-4)">Forgot password? Ask admin to reset it.</div>`;
  }
}
function togglePw(id){ const el=$('#'+id); el.type=el.type==='password'?'text':'password'; }
function phonePreview(inId,outId){ const v=$('#'+inId).value; const np=normPhone(v);
  $('#'+outId).textContent=np?('Will log in as '+np+(phoneOk(v)?'':' ⚠ may not be a valid mobile')):''; }
async function doBootstrap(){
  const name=$('#bName').value.trim(), phone=$('#bPhone').value.trim(), pw=$('#bPw').value, pw2=$('#bPw2').value;
  const err=$('#bErr');
  if(!name||!normPhone(phone)) return err.textContent='Enter your name and mobile number.';
  if(pw.length<10) return err.textContent='Password needs 10+ characters.';
  if(pw!==pw2) return err.textContent='Passwords do not match.';
  try{ const resp=await api('/bootstrap',{method:'POST',body:{name,phone,password:pw}});
    session={token:resp.token,user:resp.user}; localStorage.setItem('jms_v2_session',JSON.stringify(session));
    loadCache(); enterApp(); toast('Welcome, '+name.split(' ')[0]+'. Import your data from More → Import.','ok');
    maybeOfferLocalMigration();
  }catch(e){ err.textContent=e.message; }
}
async function doLogin(ev){
  if(ev) ev.preventDefault();
  const btn=$('#loginBtn'); btn.textContent='Signing in…'; btn.disabled=true;
  try{ const resp=await api('/login',{method:'POST',body:{phone:$('#lPhone').value,password:$('#lPw').value}});
    session={token:resp.token,user:resp.user}; localStorage.setItem('jms_v2_session',JSON.stringify(session));
    loadCache(); enterApp(); pull(); if(isAdmin()) maybeOfferLocalMigration();
  }catch(e){ $('#lErr').textContent=e.message; btn.textContent='Sign in'; btn.disabled=false; }
  return false;
}
function confirmLogout(){
  if(outbox.length){
    showModal2(`<h3>You have ${outbox.length} unsynced change${outbox.length>1?'s':''}</h3>
      <div class="sub">Logging out now will discard them. Get back online first, or log out anyway.</div>
      <div class="sheet-actions"><button class="btn ghost" onclick="closeModal2()">Stay</button>
      <button class="btn dangerbtn" onclick="closeModal2();logout()">Log out anyway</button></div>`);
    return;
  }
  logout();
}
function logout(silent){
  if(session){ localStorage.removeItem('jms_v2_cache_'+session.user.id); localStorage.removeItem('jms_v2_outbox_'+session.user.id); }
  session=null; localStorage.removeItem('jms_v2_session'); phonebook=null;
  db={groups:[],contacts:[],tasks:[],personal:[],users:[]}; outbox=[];
  closeModal(); closeModal2();
  renderLogin('login');
  if(!silent) toast('Logged out');
}

/* v1 localStorage migration */
function maybeOfferLocalMigration(){
  try{
    if(localStorage.getItem('jms_v2_migrated')) return;
    const old=JSON.parse(localStorage.getItem('jms_cos_v1'));
    if(!old||!old.groups) return;
    showModal(`<h3>Old data found on this phone</h3>
      <div class="sub">This device has data from the previous version (${(old.tasks||[]).length} tasks, ${(old.people||[]).length} people, ${(old.phonebook||[]).length} phonebook contacts). Upload it to the server? It merges — nothing gets overwritten.</div>
      <div class="sheet-actions"><button class="btn ghost" onclick="closeModal()">Later</button>
      <button class="btn" onclick="uploadLocalV1()">Upload &amp; merge</button></div>`);
  }catch(e){}
}
async function uploadLocalV1(){
  try{ const old=JSON.parse(localStorage.getItem('jms_cos_v1'));
    const resp=await api('/import',{method:'POST',body:{data:old}});
    applySnapshot(resp); localStorage.setItem('jms_v2_migrated','1');
    localStorage.removeItem('jms_cos_v1'); // server holds it now; don't leave the phonebook on-device
    closeModal(); rerender(); toast('Merged: '+resp.report.merged.tasks.added+' new tasks, '+resp.report.merged.contacts.added+' contacts','ok');
    setTimeout(offerDeadlineBackfill,600);
  }catch(e){ toast(e.message,'err'); }
}
function offerDeadlineBackfill(){
  const missing=db.tasks.filter(t=>t.status!=='done'&&!t.deadline&&t.priority!=='P4');
  if(!missing.length) return;
  showModal2(`<h3>Set deadlines on imported tasks?</h3>
    <div class="sub">${missing.length} open task${missing.length>1?'s have':' has'} no deadline, so Overdue and Due-today stay empty.
    Apply defaults from priority — P1 tomorrow · P2 +7 days · P3 +30 days? (P4 stays open-ended. You can change any of them later.)</div>
    <div class="sheet-actions"><button class="btn ghost" onclick="closeModal2()">Skip</button>
    <button class="btn" onclick="applyDeadlineBackfill()">Set deadlines</button></div>`);
}
function applyDeadlineBackfill(){
  closeModal2();
  const addDays={P1:1,P2:7,P3:30};
  const ops=db.tasks.filter(t=>t.status!=='done'&&!t.deadline&&addDays[t.priority]).map(t=>{
    const d=new Date(Date.now()+addDays[t.priority]*DAY); d.setHours(18,0,0,0);
    const {activity,...rest}=t;
    return {t:'upsert',col:'tasks',rec:{...rest,deadline:toLocalInput(d),updatedAt:Date.now()}};
  });
  mutate(ops); toast(ops.length+' deadlines set','ok');
}

/* ================= shell / nav ================= */
const NAV_ADMIN=[["chase","🎯","Chase"],["tasks","📋","Tasks"],["assign","➕","Assign"],["contacts","👥","People"],["dash","📊","Dash"],["more","⋯","More"]];
const NAV_MEMBER=[["mytasks","✅","My Tasks"],["more","⋯","More"]];
function enterApp(){
  document.body.classList.remove('no-nav');
  $('#nav').style.display='flex'; $('#appHeader').style.display='block'; $('#appWrap').style.display='block';
  $('#v-login').classList.remove('active');
  renderNav();
  go(isAdmin()?'chase':'mytasks');
}
function renderNav(){
  const items=isAdmin()?NAV_ADMIN:NAV_MEMBER;
  const over=db.tasks.some(t=>isOverdue(t));
  const verif=db.tasks.some(t=>t.status==='awaiting_verify');
  const badPh=db.contacts.some(c=>openTasksFor(c.id).length&&!c.phoneOk);
  $('#nav').innerHTML=items.map(([v,ic,l])=>`
    <button data-v="${v}" class="${currentView===v?'active':''}" onclick="${v==='more'?'openMore()':`go('${v}')`}">
      <span class="ni">${ic}</span>${l}
      ${v==='chase'&&over?'<span class="ndot red"></span>':''}
      ${v==='tasks'&&verif?'<span class="ndot"></span>':''}
      ${v==='contacts'&&badPh?'<span class="ndot"></span>':''}

function taskCard(t,opts={}){
  const g=groupById(t.groupId), c=contactById(t.contactId);
  const due=fmtDue(t.deadline);
  const lastComment=(t.activity||[]).filter(a=>a.type==='comment').slice(-1)[0];
  const admin=isAdmin();
  const tags=[
    `<span class="tag p${t.priority}">${t.priority}</span>`,
    g?`<span class="tag grp"><span class="dot" style="background:${g.color};margin-right:2px"></span>${esc(g.name)}</span>`:'',
    admin&&c?`<span class="tag who">👤 ${esc(c.name.split(' ')[0])}</span>`:'',
    !admin?`<span class="tag who">From ${esc(userName(t.createdBy))}</span>`:'',
    due?`<span class="tag due ${isOverdue(t)?'over':''}">${isOverdue(t)?'⚠ ':''}${due}</span>`:'',
    `<span class="tag st-${t.status}">${ST_LABEL[t.status]||t.status}</span>`,
    t.remindCount?`<span class="tag rem">🔔 ${t.remindCount}×</span>`:'',
    t.repeat&&t.repeat!=='none'?`<span class="tag rep">🔁 ${REPEATS[t.repeat]}</span>`:'',
  ].filter(Boolean).join('');
  let actions='';
  if(!opts.noActions){
    if(admin){
      const waBtn=c? (c.phoneOk?`<button class="ic wa" onclick="waSingle('${t.id}')">📤 WhatsApp</button>`
          :`<button class="ic disabled" onclick="toast('Fix the number for ${jsEsc(c.name.split(' ')[0])} first')">📤 WhatsApp</button>`)
        :`<button class="ic" style="border-color:var(--accent);color:var(--accent-ink)" onclick="openTaskSheet('${t.id}')">👤 Assign</button>`;
      if(t.status==='open') actions=`${waBtn}<button class="ic" onclick="setStatus('${t.id}','inprogress')">▶ Start</button><button class="ic" onclick="setStatus('${t.id}','done')">✓ Done</button>`;
      else if(t.status==='inprogress') actions=`${waBtn}<button class="ic" onclick="setStatus('${t.id}','done')">✓ Done</button>`;
      else if(t.status==='awaiting_verify') actions=`<button class="ic verifybtn" style="flex:1.4" onclick="verifyTask('${t.id}')">✓ Verify</button><button class="ic" onclick="sendBack('${t.id}')">↩ Send back</button>`;
      else actions=`<button class="ic" onclick="setStatus('${t.id}','open')">↩ Reopen</button>`;
      actions+=`<button class="ic narrow" onclick="openTaskSheet('${t.id}')">⋯</button>`;
    } else {
      if(t.status==='open') actions=`<button class="ic" onclick="setStatus('${t.id}','inprogress')">▶ Start</button><button class="ic okbtn" style="flex:1.2" onclick="memberDone('${t.id}')">✓ Mark done</button><button class="ic narrow" onclick="openComment('${t.id}')">💬</button>`;
      else if(t.status==='inprogress') actions=`<button class="ic okbtn" style="flex:2" onclick="memberDone('${t.id}')">✓ Mark done</button><button class="ic narrow" onclick="openComment('${t.id}')">💬</button>`;
      else if(t.status==='awaiting_verify') actions=`<div class="waitstrip">⏳ Waiting for ${esc(userName(t.createdBy))} to verify</div><button class="ic narrow" onclick="openComment('${t.id}')">💬</button>`;
    }
  }
  return `<div class="task ${t.priority} ${t.status==='done'?'done':''} ${t.status==='awaiting_verify'?'verify':''}">
    <div class="task-top"><div class="task-title">${esc(t.title)}</div>
      <span class="age ${ageClass(t)}">${isOverdue(t)?'⚠ ':''}${ageLabel(t)}</span></div>
    ${t.notes?`<div class="notes">${esc(t.notes)}</div>`:''}
    <div class="task-meta">${tags}</div>
    ${lastComment?`<div class="cmt">💬 ${esc(userName(lastComment.uid))} · ${fmtAgo(lastComment.ts)} — ${esc(lastComment.data.text)}</div>`:''}
    ${actions?`<div class="task-actions">${actions}</div>`:''}
  </div>`;
}
function nextDate(d,rep){ const x=new Date(d);
  if(rep==='weekly') x.setDate(x.getDate()+7);
  else if(rep==='monthly') x.setMonth(x.getMonth()+1);
  else if(rep==='quarterly') x.setMonth(x.getMonth()+3);
  else if(rep==='yearly') x.setFullYear(x.getFullYear()+1);
  return x; }
let _lastStatusTap={id:null,ts:0};
function setStatus(id,to,label){
  if(_lastStatusTap.id===id&&Date.now()-_lastStatusTap.ts<700) return; // swallow double-taps on swapped-in buttons
  _lastStatusTap={id,ts:Date.now()};
  const t=db.tasks.find(x=>x.id===id);
  const op={t:'status',id,to};
  if(to==='done'&&t&&t.repeat&&t.repeat!=='none'&&t.deadline){
    op.roll=true; op.nextDeadline=toLocalInput(nextDate(t.deadline,t.repeat));
    mutate([op]); toast((label||'Done')+' ✓ — next due '+fmtDue(op.nextDeadline),'ok'); return;
  }
  mutate([op]);
  if(to==='done') toast((label||'Done')+' ✓','ok');
}

function waLink(phone,msg){ return 'https://wa.me/'+normPhone(phone)+'?text='+encodeURIComponent(msg); }
function firstName(n){ return (n||'').trim().split(/\s+/)[0]||''; }
function taskLine(t,idx){
  const parts=[];
  if(t.deadline) parts.push('due '+fmtDue(t.deadline));
  parts.push('pending '+ageDays(t)+(ageDays(t)===1?' day':' days'));
  let line=`${idx}. *${t.title}* — ${parts.join(' · ')}`;
  if(t.notes) line+=`\n   Note: ${t.notes.replace(/\n/g,' / ')}`;
  return line;
}
function buildContactMsg(contact,tasks){
  const byGroup=new Map();
  for(const t of tasks.slice().sort((a,b)=>prioRank(a.priority)-prioRank(b.priority))){
    const gname=(groupById(t.groupId)||{}).name||'Other';
    if(!byGroup.has(gname)) byGroup.set(gname,[]);
    byGroup.get(gname).push(t);
  }
  let m=`Namaste ${firstName(contact.name)} ji 🙏\n\nAapke pending tasks (${tasks.length}):\n`;
  let n=0;
  for(const [gname,list] of byGroup){
    m+=`\n*${gname}*\n`;
    for(const t of list) m+=taskLine(t,++n)+'\n';
  }
  m+=`\nReply *DONE <number>* jab complete ho jaye (e.g. DONE 1).\n\n— ${me().name}, JMS`;
  return m;
}
function buildSingleMsg(t){
  const c=contactById(t.contactId), g=groupById(t.groupId);
  const parts=[]; if(g) parts.push(g.name); if(t.deadline) parts.push('due '+fmtDue(t.deadline));
  parts.push('pending '+ageDays(t)+' days');
  let m=`Namaste ${firstName(c.name)} ji 🙏\n\nKind reminder:\n\n*${t.title}*\n${parts.join(' · ')}`;
  if(t.notes) m+=`\nNote: ${t.notes}`;
  m+=`\n\nReply *DONE* jab complete ho jaye.\n\n— ${me().name}, JMS`;
  return m;
}
function waSingle(id){
  const t=db.tasks.find(x=>x.id===id); const c=contactById(t.contactId);
  if(!c) return toast('No contact on this task');
  window.open(waLink(c.phone,buildSingleMsg(t)),'_blank');
  mutate([{t:'remind',ids:[id]}]);
}
function remindAll(cid){
  const c=contactById(cid); if(!c) return;
  if(!c.phoneOk) return toast('Fix the number first');
  const tasks=chaseTasksFor(cid);
  if(!tasks.length) return toast('No pending tasks');
  window.open(waLink(c.phone,buildContactMsg(c,tasks)),'_blank');
  mutate([{t:'remind',ids:tasks.map(t=>t.id)}]);
  toast('Reminder sent to '+firstName(c.name),'ok');
}

/* ================= CHASE ================= */
let chaseFilter='all', chaseSel=new Set(), chaseForced=new Set();
function remindedToday(c){ const ts=chaseTasksFor(c.id);
  return ts.length>0&&ts.every(t=>t.lastRemindedAt&&new Date(t.lastRemindedAt).toDateString()===new Date().toDateString()); }
function chaseRows(){
  const myCid=me().contactId;
  let rows=db.contacts.filter(c=>c.id!==myCid&&chaseTasksFor(c.id).length);
  rows=rows.map(c=>{ const ts=chaseTasksFor(c.id);
    return {c,tasks:ts,over:ts.some(isOverdue),age:Math.max(...ts.map(ageDays)),
      lastRem:Math.max(0,...ts.map(t=>t.lastRemindedAt||0)),today:remindedToday(c)}; });
  if(chaseFilter==='overdue') rows=rows.filter(r=>r.over);
  if(chaseFilter==='old') rows=rows.filter(r=>r.age>=7);
  if(chaseFilter==='notToday') rows=rows.filter(r=>!r.today);
  rows.sort((a,b)=>(b.over-a.over)||(b.age-a.age)||(a.lastRem-b.lastRem));
  return rows;
}
function renderChase(){
  const rows=chaseRows();
  const allRows=db.contacts.filter(c=>c.id!==me().contactId&&chaseTasksFor(c.id).length);
  const totOpen=db.tasks.filter(t=>t.status==='open'||t.status==='inprogress').length;
  const totOver=db.tasks.filter(isOverdue).length;
  const totVerif=db.tasks.filter(t=>t.status==='awaiting_verify').length;
  header('Chase Queue',`${allRows.length} people · ${totOpen} open · ${totOver} overdue${totVerif?` · ${totVerif} to verify`:''}`,
    `<button class="hbtn" onclick="go('dash')">📊</button>`);
  for(const id of [...chaseSel]) if(!rows.some(r=>r.c.id===id)) chaseSel.delete(id);
  const filters=[['all','Everyone'],['overdue','Overdue'],['old','7d+ old'],['notToday','Not reminded today']];
  let html=totVerif?`<div class="hint warnbox" style="margin:0 0 10px;cursor:pointer;font-weight:700" onclick="fMisc='verify';fGroup='all';go('tasks')">⏳ ${totVerif} task${totVerif>1?'s':''} waiting for your verification — tap to review</div>`:'';
  html+=`<div class="filters">${filters.map(([k,l])=>`<div class="fchip ${chaseFilter===k?'sel':''}" onclick="chaseFilter='${k}';rerender()">${l}</div>`).join('')}</div>`;
  if(!rows.length){
    html+= allRows.length? `<div class="empty"><div class="big">🔍</div>No one matches this filter.<br><button class="btn ghost" onclick="chaseFilter='all';rerender()">Show everyone</button></div>`
      : `<div class="empty"><div class="big">🎉</div>Sab clear! No one owes you anything today.<br><button class="btn" onclick="go('assign')">Assign a task</button></div>`;
    $('#v-chase').innerHTML=html; hideActionbar(); return;
  }
  const selectable=rows.filter(r=>r.c.phoneOk&&(!r.today||chaseForced.has(r.c.id)));
  const allSel=selectable.length&&selectable.every(r=>chaseSel.has(r.c.id));
  html+=`<div class="selrow"><span class="chk-hit" onclick="chaseSelectAll()"><span class="chk ${allSel?'on':''}">${allSel?'✓':''}</span></span>
    <span style="flex:1;margin-left:2px">Select all ${selectable.length}</span><span>Worst first</span></div>`;
  html+=rows.map(r=>{
    const c=r.c;
    const mems=(c.memberships||[]).map(m=>(groupById(m.groupId)||{}).name).filter(Boolean).join(' · ');
    const g0=groupById((c.memberships[0]||{}).groupId);
    const canSel=c.phoneOk&&(!r.today||chaseForced.has(c.id));
    const sel=chaseSel.has(c.id);
    const right=!c.phoneOk?`<span class="tag warnfix" onclick="openContactSheet('${c.id}')">⚠ Fix number</span>`
      : r.today&&!chaseForced.has(c.id)?`<span style="font-size:0.72rem;color:var(--ink-4)">Reminded ${fmtAgo(r.lastRem)}</span>`
      : `<span class="age ${r.over||r.age>=7?'hot':r.age>=3?'warm':''}">${r.over?'⚠ ':''}${r.age}d</span>`;
    return `<div class="chase-row ${r.today?'sent':''}">
      <span class="chk-hit" onclick="chaseToggle('${c.id}')"><span class="chk ${sel?'on':canSel?'':'off'}">${sel?'✓':''}</span></span>
      <div class="avatar" style="background:${g0?g0.color:'#475569'}">${esc((c.name[0]||'?').toUpperCase())}</div>
      <div class="crow-main" onclick="openContactTasks('${c.id}')">
        <div class="crow-name">${esc(c.name)}</div>
        <div class="crow-meta">${esc(mems)}${r.lastRem&&!r.today?` · 🔔 last ${fmtAgo(r.lastRem)}`:''}</div>
      </div>
      <span class="count">${r.tasks.length}</span>${right}
    </div>`;
  }).join('');
  $('#v-chase').innerHTML=html;
  renderChaseBar();
}
function chaseToggle(id){
  const c=contactById(id);
  if(!c.phoneOk){ toast('Fix the number first'); openContactSheet(id); return; }
  if(remindedToday(c)&&!chaseForced.has(id)&&!chaseSel.has(id)){
    chaseForced.add(id); toast('Already reminded today — tap again to include'); rerender(); return;
  }
  chaseSel.has(id)?chaseSel.delete(id):chaseSel.add(id); rerender();
}
function chaseSelectAll(){
  const selectable=chaseRows().filter(r=>r.c.phoneOk&&(!r.today||chaseForced.has(r.c.id)));
  const all=selectable.length&&selectable.every(r=>chaseSel.has(r.c.id));
  chaseSel=all?new Set():new Set(selectable.map(r=>r.c.id));
  rerender();
}
function renderChaseBar(){

}

function hideActionbar(){ $('#actionbar').classList.remove('show'); document.body.classList.remove('has-actionbar'); }

/* chase stepper */
let stepQueue=[], stepIdx=0, stepDone=0, stepSkip=0, stepTasks=0;
function startStepper(){

function renderStepper(state){

    showModal(`<h3 style="text-align:center">✅</h3>

    ? `<div class="sub" style="margin-top:12px">Did the message go out to ${esc(firstName(c.name))}?</div>

      <h3>Sending reminders</h3><span style="font-size:0.8rem;font-weight:700;color:var(--ink-3)">${stepIdx+1} of ${stepQueue.length}</span></div>

    <div class="card" style="background:var(--surface-2);margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="avatar" style="width:36px;height:36px;background:${g0?g0.color:'#475569'}">${esc((c.name[0]||'?').toUpperCase())}</div>
        <div><div style="font-weight:700">${esc(c.name)}</div>
        <div style="font-size:0.76rem;color:var(--ink-3)">${esc(c.phone)} · ${tasks.length} task${tasks.length>1?'s':''}</div></div>
      </div></div>
    <label class="f">Message preview</label>
    <div class="msgprev">${esc(msg)}</div>
    ${body}`,true);
}
function stepOpen(){

/* ================= TASKS ================= */
let fGroup='all', fMisc='all', taskSearch='';
function renderTasks(){
  const verifN=db.tasks.filter(t=>t.status==='awaiting_verify').length;
  const list=db.tasks.filter(taskMatches).sort((a,b)=>{
    if((a.status==='done')!==(b.status==='done')) return a.status==='done'?1:-1;
    if(prioRank(a.priority)!==prioRank(b.priority)) return prioRank(a.priority)-prioRank(b.priority);
    const da=a.deadline?new Date(a.deadline).getTime():Infinity, dbb=b.deadline?new Date(b.deadline).getTime():Infinity;
    if(da!==dbb) return da-dbb;

  });

    `<button class="hbtn" onclick="go('assign')">➕</button>`);

  const misc=[['all','All'],['open','Open'],['inprogress','In progress'],
    ['verify',`⏳ Verify${verifN?` (${verifN})`:''}`],['over','Overdue'],['today','Due today'],['P1','P1'],['old','7d+ old'],['done','Done']];
  let html=`<input id="taskSearch" type="search" placeholder="Search task, person, company…" value="${esc(taskSearch)}"

    <div class="filters">${misc.map(([k,l])=>`<div class="fchip ${fMisc===k?'sel':''} ${k==='verify'&&verifN&&fMisc!=='verify'?'verifychip':''}" onclick="fMisc='${k}';rerender()">${l}</div>`).join('')}</div>
    <div id="taskList"></div>`;
  $('#v-tasks').innerHTML=html;
  renderTaskListOnly();
}
function renderTaskListOnly(){
  const list=db.tasks.filter(taskMatches).sort((a,b)=>{
    if((a.status==='done')!==(b.status==='done')) return a.status==='done'?1:-1;
    if(prioRank(a.priority)!==prioRank(b.priority)) return prioRank(a.priority)-prioRank(b.priority);
    const da=a.deadline?new Date(a.deadline).getTime():Infinity, dbb=b.deadline?new Date(b.deadline).getTime():Infinity;
    if(da!==dbb) return da-dbb;
    return ageDays(b)-ageDays(a);
  });
  const el=$('#taskList'); if(!el) return;
  if(!list.length){
    el.innerHTML=db.tasks.length?`<div class="empty"><div class="big">🔍</div>Nothing matches.<br><button class="btn ghost" onclick="fGroup='all';fMisc='all';taskSearch='';rerender()">Clear filters</button></div>`
      :`<div class="empty"><div class="big">📋</div>No tasks yet.<br><button class="btn" onclick="go('assign')">Assign your first task</button></div>`;
    return;
  }
  el.innerHTML=list.map(t=>taskCard(t)).join('');
}
function taskMatches(t){
  if(fGroup!=='all'&&t.groupId!==fGroup) return false;
  const q=taskSearch.trim().toLowerCase();
  if(q){ const c=contactById(t.contactId), g=groupById(t.groupId);
    const hay=(t.title+' '+(t.notes||'')+' '+(c?c.name:'')+' '+(g?g.name:'')).toLowerCase();
    if(!hay.includes(q)) return false; }
  if(fMisc==='open') return t.status==='open';
  if(fMisc==='inprogress') return t.status==='inprogress';
  if(fMisc==='verify') return t.status==='awaiting_verify';
  if(fMisc==='done') return t.status==='done';
  if(fMisc==='over') return isOverdue(t);
  if(fMisc==='today'){ if(!t.deadline||t.status==='done') return false; return new Date(t.deadline).toDateString()===new Date().toDateString(); }
  if(fMisc==='P1') return t.priority==='P1'&&t.status!=='done';
  if(fMisc==='old') return t.status!=='done'&&ageDays(t)>=7;
  return true;
}

function deadlineForPreset(mode,prio){
  const d=new Date();

  if(mode==='tomorrow'){ d.setDate(d.getDate()+1); d.setHours(18,0,0,0); return toLocalInput(d); }
  if(mode==='week'){ d.setDate(d.getDate()+7); d.setHours(18,0,0,0); return toLocalInput(d); }
  return null;
}

function renderDash(){
  header('Dashboard','As of '+new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}));
  const active=db.tasks.filter(t=>t.status!=='done');
  const by=p=>active.filter(t=>t.priority===p).length;
  const over=active.filter(isOverdue), verif=db.tasks.filter(t=>t.status==='awaiting_verify');
  const buckets=[['0–2 days',t=>ageDays(t)<=2,'#64748b'],['3–6 days',t=>ageDays(t)>=3&&ageDays(t)<=6,'#f59e0b'],
    ['7–14 days',t=>ageDays(t)>=7&&ageDays(t)<=14,'#f97316'],['15+ days',t=>ageDays(t)>=15,'#ef4444']];
  const bmax=Math.max(1,...buckets.map(([,f])=>active.filter(f).length));
  const focus=active.filter(t=>t.priority==='P1'||isOverdue(t)).sort((a,b)=>prioRank(a.priority)-prioRank(b.priority)).slice(0,3);
  const pc={}; active.forEach(t=>{ if(t.contactId) pc[t.contactId]=(pc[t.contactId]||0)+1; });
  const gc={}; active.forEach(t=>{ gc[t.groupId]=(gc[t.groupId]||0)+1; });
  const selfTasks=active.filter(t=>t.contactId&&t.contactId===me().contactId);
  $('#v-dash').innerHTML=`
    <div class="stats">${['P1','P2','P3','P4'].map(p=>
      `<div class="stat ${p.toLowerCase()}" onclick="fMisc='${p==='P1'?'P1':'all'}';fGroup='all';go('tasks')"><div class="n">${by(p)}</div><div class="l">${p}</div></div>`).join('')}</div>
    <div class="stats two">
      <div class="stat overdue" onclick="fMisc='over';go('tasks')"><div class="n">${over.length}</div><div class="l">Overdue</div></div>
      <div class="stat verify" onclick="fMisc='verify';go('tasks')"><div class="n">${verif.length}</div><div class="l">Awaiting verify</div></div></div>
    <div class="card"><h2 class="sec">⏳ How old is the work</h2><div class="bars">${buckets.map(([l,f,col])=>{
      const n=active.filter(f).length;
      return `<div class="bar-row"><div class="bar-lbl">${l}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/bmax*100)}%;background:${col}"></div></div><div class="bar-n">${n}</div></div>`;}).join('')}</div></div>
    <div class="card"><h2 class="sec">🎯 Today's focus</h2>${focus.length?focus.map(t=>taskCard(t)).join(''):'<div class="hint">Nothing urgent. 👍</div>'}</div>
    <div class="card"><h2 class="sec">Workload by person</h2><div class="bars">${barChart(pc,id=>(contactById(id)||{name:'?'}).name)}</div></div>
    <div class="card"><h2 class="sec">Workload by company</h2><div class="bars">${barChart(gc,id=>(groupById(id)||{name:'?'}).name)}</div></div>
    ${selfTasks.length?`<div class="card"><h2 class="sec">🙋 On my own plate (${selfTasks.length})</h2>${selfTasks.map(t=>taskCard(t)).join('')}</div>`:''}
    <button class="btn" style="background:#0e7490;margin-bottom:12px" onclick="syncAllToCalendar()">📅 Sync deadlines to Calendar</button>`;
}
function barChart(counts,labelFn){
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!entries.length) return '<div class="hint">No active tasks.</div>';
  const max=Math.max(...entries.map(e=>e[1]));
  return entries.map(([id,n])=>`<div class="bar-row"><div class="bar-lbl">${esc(labelFn(id))}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/max*100)}%"></div></div><div class="bar-n">${n}</div></div>`).join('');
}

$('#importFile').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.groups) throw new Error('Not a valid backup file');
      const summary=`${(d.tasks||[]).length} tasks, ${(d.people||d.contacts||[]).length} people, ${(d.phonebook||[]).length} phonebook`;
      showModal2(`<h3>Merge this file into the server?</h3><div class="sub">${summary}. Existing data is kept; newer records win.</div>
        <div class="sheet-actions"><button class="btn ghost" onclick="closeModal2()">Cancel</button>
        <button class="btn" onclick="closeModal2();doImport()">Merge</button></div>`);
      window._pendingImport=d;
    }catch(e){ toast('Invalid file','err'); }
  };
  r.readAsText(f); ev.target.value='';
};
async function doImport(){
  const d=window._pendingImport; if(!d) return;
  try{ const resp=await api('/import',{method:'POST',body:{data:d}});
    applySnapshot(resp); closeModal(); rerender();
    const m=resp.report.merged;
    toast(`Merged: +${m.tasks?m.tasks.added:0} tasks, +${m.contacts?m.contacts.added:0} contacts`,'ok');
    setTimeout(offerDeadlineBackfill,600);
  }catch(e){ toast(e.message,'err'); }
  window._pendingImport=null;
}
$('#vcfFile').onchange=ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let parsed; try{ parsed=parseVcf(r.result); }catch(e){ toast('Could not read file','err'); return; }
    if(!parsed.length){ toast('No contacts found in file'); return; }
    mutate([{t:'pbMerge',entries:parsed}]);
    if(phonebook) { const seen=new Set(phonebook.map(c=>normPhone(c.phone)));
      parsed.forEach(c=>{ if(!seen.has(normPhone(c.phone))) phonebook.push({...c,normPhone:normPhone(c.phone)}); }); }
    toast(parsed.length+' contacts sent to phonebook','ok'); closeModal();
  };
  r.readAsText(f); ev.target.value='';
};
function parseVcf(text){
  const out=[]; const uf=text.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'');
  for(const c of uf.split(/BEGIN:VCARD/i)){
    if(!/END:VCARD/i.test(c)) continue;
    const fn=(c.match(/\nFN[^:]*:(.*)/i)||[])[1];
    const tel=(c.match(/\n(?:item\d+\.)?TEL[^:]*:(.*)/i)||[])[1];
    if(fn&&tel){ const name=fn.trim().replace(/\\,/g,',').replace(/\\;/g,';'); const phone=tel.trim();
      if(name&&phone) out.push({name,phone}); } }
  return out;
}

/* ================= calendar (.ics) ================= */
function icsEsc(s){ return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsDate(d){ return new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
function rrule(rep){ return {weekly:'FREQ=WEEKLY',monthly:'FREQ=MONTHLY',quarterly:'FREQ=MONTHLY;INTERVAL=3',yearly:'FREQ=YEARLY'}[rep]||''; }
function taskVEvent(t){
  const c=contactById(t.contactId), g=groupById(t.groupId);
  const start=new Date(t.deadline), end=new Date(start.getTime()+3600000);
  const desc=[t.notes,g?('Company: '+g.name):'',c?('Assigned: '+c.name+' ('+c.phone+')'):'','Priority: '+t.priority].filter(Boolean).join('\n');
  const lines=['BEGIN:VEVENT','UID:'+t.id+'@jms-cos','DTSTAMP:'+icsDate(Date.now()),'DTSTART:'+icsDate(start),'DTEND:'+icsDate(end)];
  const rr=rrule(t.repeat); if(rr) lines.push('RRULE:'+rr);
  lines.push('SUMMARY:'+icsEsc('[JMS] '+t.title+(c?(' — '+c.name):'')),'DESCRIPTION:'+icsEsc(desc),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder','TRIGGER:-P1D','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Reminder','TRIGGER:-PT1H','END:VALARM','END:VEVENT');
  return lines.join('\r\n');
}
function downloadICS(name,events){
  const cal=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//JMS//Chief-of-Staff//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',...events,'END:VCALENDAR'].join('\r\n');
  const blob=new Blob([cal],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
function mineToCalendar(id){ const t=(db.personal||[]).find(x=>x.id===id);
  if(!t||!t.deadline){ toast('Add a deadline first'); return; } downloadICS('task.ics',[taskVEvent(t)]); toast('Add to Calendar…'); }
function syncAllToCalendar(){
  const evs=db.tasks.filter(t=>t.deadline&&t.status!=='done').map(taskVEvent)
    .concat((db.personal||[]).filter(t=>t.deadline&&t.status!=='done').map(taskVEvent));
  if(!evs.length){ toast('No tasks with deadlines'); return; }
  downloadICS('jms-tasks.ics',evs); toast(evs.length+' events → Calendar','ok');
}

/* ================= modals + history ================= */
function showModal(html){ sheetRefresh=null; $('#sheet').innerHTML=html; $('#modal').classList.add('show'); }
function closeModal(){ sheetRefresh=null; $('#modal').classList.remove('show'); }
function showModal2(html){ $('#sheet2').innerHTML=html; $('#modal2').classList.add('show'); }
function closeModal2(){ $('#modal2').classList.remove('show'); }
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
$('#modal2').onclick=e=>{ if(e.target.id==='modal2') closeModal2(); };
let _lastBackTs=0;
window.addEventListener('popstate',(e)=>{
  if($('#modal2').classList.contains('show')){ closeModal2(); history.pushState({},''); return; }
  if($('#modal').classList.contains('show')){ closeModal(); history.pushState({},''); return; }
  if(e.state&&e.state.v&&session){ // back navigates between views
    currentView=e.state.v;
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    const el=$('#v-'+e.state.v); if(el) el.classList.add('active');
    hideActionbar(); rerender(); window.scrollTo(0,0); return;
  }
  if(Date.now()-_lastBackTs<2000) return; // second back within 2s: let the browser exit
  _lastBackTs=Date.now(); toast('Press back again to exit');
  history.pushState({},'');
});
history.pushState({},'');

/* ================= init ================= */
(async function init(){
  if(session){ loadCache(); enterApp(); pull(); if(isAdmin()) maybeOfferLocalMigration(); return; }
  try{ const st=await api('/state'); renderLogin(st.bootstrapped?'login':'bootstrap'); }
  catch(e){ renderLogin('login'); $('#lErr')&&($('#lErr').textContent='Cannot reach server — check connection.'); }
})();
</script>
